<div
  class="px-4 py-3 bg-slate-50/70 border-t border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3 select-none">

  <div class="flex flex-wrap items-center gap-3 text-xs text-slate-600">
    <div class="flex items-center gap-1.5">
      <span class="font-medium text-slate-500">Show:</span>
      <select (change)="changePageSize($event)"
        class="bg-white border border-slate-200 hover:border-slate-300 rounded-md px-2.5 py-1 text-xs font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 cursor-pointer shadow-2xs">
        <option value="5">5</option>
        <option value="10">10</option>
        <option value="15">15</option>
      </select>
      <span class="font-medium text-slate-500">entries</span>
    </div>

    <span class="text-slate-300 hidden sm:inline">|</span>

    <div class="text-slate-600 font-medium">
      <span>
        Showing
        <strong class="font-mono font-bold text-slate-900">{{startIndex()}}</strong>
        to
        <strong class="font-mono font-bold text-slate-900">{{endIndex()}}</strong>
        of
        <strong class="font-mono font-bold text-indigo-600">{{itemCount()}}</strong>
        records
      </span>
    </div>
  </div>

  <div class="flex items-center gap-1 self-center sm:self-auto">
    <button type="button"
      class="p-1.5 rounded-md border border-slate-200 bg-white text-slate-600 hover:bg-slate-100 hover:text-slate-900 disabled:opacity-35 disabled:cursor-not-allowed transition-colors cursor-pointer shadow-2xs"
      title="First Page" [disabled]="pageNum() == 1" (click)="goToPage(1)">
      <lucide-angular [name]="icons.ChevronsLeft" class="w-4 h-4"></lucide-angular>
    </button>

    <button type="button"
      class="px-2.5 py-1 rounded-md border border-slate-200 bg-white text-slate-600 hover:bg-slate-100 hover:text-slate-900 disabled:opacity-35 disabled:cursor-not-allowed transition-colors cursor-pointer flex items-center gap-1 text-xs font-semibold shadow-2xs"
      title="Previous" [disabled]="pageNum() == 1" (click)="prevPage()">
      <lucide-angular [name]="icons.ChevronLeft" class="w-4 h-4"></lucide-angular>
      <span class="hidden md:inline">Prev</span>
    </button>

    <div class="flex items-center gap-1 mx-1">
      @for (p of visiblePages(); track $index) {
      <button type="button" (click)="goToPage(p)" [class.bg-indigo-600]="p === pageNum()"
        [class.text-white]="p === pageNum()" [class.shadow-xs]="p === pageNum()" [class.bg-white]="p !== pageNum()"
        [class.text-slate-600]="p !== pageNum()" [class.border]="p !== pageNum()"
        [class.border-slate-200]="p !== pageNum()" [class.hover:bg-slate-100]="p !== pageNum()"
        class="min-w-7 h-7 px-2 rounded-md text-xs font-bold transition-colors cursor-pointer flex items-center justify-center font-mono">
        {{p}}
      </button>
      }
    </div>

    <button type="button" [disabled]="pageNum() == pagesCount()" (click)="nextPage()"
      class="px-2.5 py-1 rounded-md border border-slate-200 bg-white text-slate-600 hover:bg-slate-100 hover:text-slate-900 disabled:opacity-35 disabled:cursor-not-allowed transition-colors cursor-pointer flex items-center gap-1 text-xs font-semibold shadow-2xs"
      title="Next">
      <span class="hidden md:inline">Next</span>
      <lucide-angular [name]="icons.ChevronRight" class="w-4 h-4"></lucide-angular>
    </button>

    <button type="button" [disabled]="pageNum() == pagesCount()" (click)="goToPage(pagesCount())"
      class="p-1.5 rounded-md border border-slate-200 bg-white text-slate-600 hover:bg-slate-100 hover:text-slate-900 disabled:opacity-35 disabled:cursor-not-allowed transition-colors cursor-pointer shadow-2xs"
      title="Last Page">
      <lucide-angular [name]="icons.ChevronsRight" class="w-4 h-4"></lucide-angular>
    </button>
  </div>
</div>
